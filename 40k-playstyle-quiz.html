<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>What's Your 40K Playstyle?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,500&family=Oswald:wght@500;600&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(ellipse at 50% -10%, #201a1c 0%, #100d10 55%, #0b090b 100%);
    color: #e9e1cd;
    font-family: 'Crimson Pro', serif;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  #app { width: 100%; max-width: 640px; }

  .eyebrow {
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-size: 11px;
    color: #9c8f6f;
  }
  .display {
    font-family: 'Cinzel', serif;
    letter-spacing: 0.02em;
  }
  .rule {
    height: 1px;
    background: linear-gradient(90deg, transparent, #b9924a66, transparent);
  }

  /* Intro */
  .intro { text-align: center; padding: 36px 8px; }
  .intro h1 {
    font-size: 34px; font-weight: 800; color: #e9e1cd;
    margin: 14px 0 18px; line-height: 1.15;
  }
  .intro p {
    color: #a89c86; font-size: 17px; max-width: 460px;
    margin: 0 auto 30px; line-height: 1.6;
  }

  /* Buttons */
  .btn-primary {
    font-family: 'Oswald', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; font-size: 13px;
    background: #7c2029; color: #f2e6d8; border: 1px solid #a03039; padding: 14px 28px;
    cursor: pointer; transition: all 0.15s ease; border-radius: 2px;
  }
  .btn-primary:hover { background: #93262f; }
  .btn-ghost {
    font-family: 'Oswald', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px;
    background: transparent; color: #b9924a; border: 1px solid #b9924a55; padding: 12px 22px;
    cursor: pointer; border-radius: 2px; transition: all .15s ease;
  }
  .btn-ghost:hover { background: #b9924a1a; }

  /* Question screen */
  .q-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .q-header .blood { color: #7c2029; }
  .progress-track { height: 2px; background: #2a2426; margin-bottom: 28px; position: relative; }
  .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: #b9924a; transition: width .3s ease; }
  .q-title {
    font-size: 24px; font-weight: 700; color: #e9e1cd;
    margin-bottom: 24px; line-height: 1.35;
  }
  .opt-btn {
    text-align: left; width: 100%; padding: 16px 18px; margin-bottom: 10px;
    background: #19161a; border: 1px solid #322b2c; color: #e9e1cd;
    font-family: 'Crimson Pro', serif; font-size: 16px; line-height: 1.4;
    border-radius: 2px; cursor: pointer; transition: all 0.15s ease; display: block;
  }
  .opt-btn:hover { border-color: #b9924a; background: #221c1d; transform: translateX(2px); }
  .opt-btn:focus-visible { outline: 2px solid #b9924a; outline-offset: 2px; }

  /* Results */
  .macro-label {
    text-align: center; font-size: 13px; letter-spacing: 0.2em; color: #7c2029;
    margin-bottom: 22px; text-transform: uppercase;
  }
  .radar-wrap { width: 100%; margin-bottom: 8px; display: flex; justify-content: center; }
  .archetype-name {
    font-size: 30px; font-weight: 800; color: #e9e1cd; margin-bottom: 14px; line-height: 1.2;
  }
  .archetype-quote {
    font-style: italic; color: #c9bda0; font-size: 18px; max-width: 480px;
    margin: 0 auto; line-height: 1.6;
  }
  .chip {
    font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 6px 12px; border: 1px solid #b9924a55; color: #d8c79a; border-radius: 2px; background: #1c1717;
    display: inline-block;
  }
  .chip-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .secondary-box {
    background: #19161a; border: 1px solid #2a2426; padding: 18px 22px;
    margin-bottom: 30px; border-radius: 2px;
  }
  .secondary-box .sub-name { font-size: 17px; font-weight: 700; color: #e9e1cd; margin-bottom: 6px; }
  .secondary-box .sub-quote { color: #a89c86; font-size: 14.5px; margin-bottom: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------

const MACRO_ORDER = ["Firepower", "Mass", "Pressure", "Elite", "Mobility", "Attrition", "Synergy", "Ambush", "Toolbox"];

function find(macro, sub) {
  return ARCHETYPES.find(a => a.macro === macro && a.sub === sub);
}

// ---------------------------------------------------------------------------
// Questions
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// State + render
// ---------------------------------------------------------------------------
let step = -1; // -1 = intro, 0..N-1 = questions, N = results
let scores = {};

function choose(optionScores) {
  Object.entries(optionScores).forEach(([k, v]) => {
    scores[k] = (scores[k] || 0) + v;
  });
  step += 1;
  render();
}

function restart() {
  scores = {};
  step = -1;
  render();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderIntro() {
  return `
    <div class="intro">
      <div class="eyebrow" style="margin-bottom:14px;">Doctrine Assessment · 20 Questions</div>
      <h1 class="display">WHAT'S YOUR<br/>40K PLAYSTYLE?</h1>
      <p>Answer honestly about how you actually like to play — not the army you think you should like —
      and we'll run an auspex scan to find the archetype, and factions, that fit.</p>
      <button class="btn-primary" id="start-btn">Begin Assessment</button>
    </div>
  `;
}

function renderQuestion(index) {
  const q = QUESTIONS[index];
  const total = QUESTIONS.length;
  const pct = (index / total) * 100;
  const optionsHtml = q.options.map((opt, i) =>
    `<button class="opt-btn" data-opt="${i}">${escapeHtml(opt.label)}</button>`
  ).join("");

  return `
    <div class="q-header">
      <span class="eyebrow">Turn ${String(index + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}</span>
      <span class="eyebrow blood">Auspex Reading</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <h2 class="display q-title">${escapeHtml(q.text)}</h2>
    <div id="options">${optionsHtml}</div>
  `;
}

function computeMacroTotals() {
  return MACRO_ORDER.map(macro => {
    const value = Object.entries(scores)
      .filter(([k]) => k.startsWith(macro + "|"))
      .reduce((sum, [, v]) => sum + v, 0);
    return { category: macro, value };
  });
}

function radarSVG(macroTotals) {
  const size = 300;
  const cx = size / 2, cy = size / 2;
  const outerR = 105;
  const maxVal = Math.max(...macroTotals.map(m => m.value), 1);
  const n = macroTotals.length;

  const angleFor = i => (Math.PI * 2 * i) / n - Math.PI / 2;

  // grid rings
  let rings = "";
  [0.25, 0.5, 0.75, 1].forEach(f => {
    const pts = macroTotals.map((_, i) => {
      const a = angleFor(i);
      const r = outerR * f;
      return `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
    }).join(" ");
    rings += `<polygon points="${pts}" fill="none" stroke="#3a3234" stroke-width="1"/>`;
  });

  // spokes
  let spokes = "";
  macroTotals.forEach((_, i) => {
    const a = angleFor(i);
    const x = cx + outerR * Math.cos(a);
    const y = cy + outerR * Math.sin(a);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#3a3234" stroke-width="1"/>`;
  });

  // data polygon
  const dataPts = macroTotals.map((m, i) => {
    const a = angleFor(i);
    const r = outerR * (m.value / maxVal);
    return `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
  }).join(" ");
  const dataPolygon = `<polygon points="${dataPts}" fill="#7c2029" fill-opacity="0.55" stroke="#b9924a" stroke-width="2"/>`;

  // labels
  let labels = "";
  macroTotals.forEach((m, i) => {
    const a = angleFor(i);
    const r = outerR + 20;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    let anchor = "middle";
    if (Math.cos(a) > 0.3) anchor = "start";
    else if (Math.cos(a) < -0.3) anchor = "end";
    labels += `<text x="${x}" y="${y}" fill="#b9924a" font-size="11" font-family="Oswald, sans-serif" text-anchor="${anchor}" dominant-baseline="middle">${m.category}</text>`;
  });

  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="300" style="max-width:340px;">
    ${rings}${spokes}${dataPolygon}${labels}
  </svg>`;
}

function renderResults() {
  const sortedSubs = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const topKeyStr = sortedSubs[0] ? sortedSubs[0][0] : null;
  if (!topKeyStr) return "";
  const topMacro = topKeyStr.split("|")[0];
  const secondEntry = sortedSubs.find(([k]) => k.split("|")[0] !== topMacro);
  const secondKeyStr = secondEntry ? secondEntry[0] : null;

  const topArchetype = find(...topKeyStr.split("|"));
  const secondArchetype = secondKeyStr ? find(...secondKeyStr.split("|")) : null;

  const macroTotals = computeMacroTotals();

  const factionChips = topArchetype.factions.map(f => `<span class="chip">${escapeHtml(f)}</span>`).join("");

  let secondaryHtml = "";
  if (secondArchetype) {
    const chips2 = secondArchetype.factions.map(f => `<span class="chip" style="font-size:10.5px;padding:4px 9px;">${escapeHtml(f)}</span>`).join("");
    secondaryHtml = `
      <div class="secondary-box">
        <div class="eyebrow" style="margin-bottom:8px;">Secondary Leaning — ${secondArchetype.macro}</div>
        <div class="display sub-name">${escapeHtml(secondArchetype.sub)}</div>
        <p class="sub-quote">"${escapeHtml(secondArchetype.fantasy)}"</p>
        <div class="chip-row" style="gap:6px;">${chips2}</div>
      </div>
    `;
  }

  return `
    <div class="eyebrow" style="text-align:center;margin-bottom:6px;">Auspex Scan Complete</div>
    <h2 class="display macro-label">${topArchetype.macro}</h2>
    <div class="radar-wrap">${radarSVG(macroTotals)}</div>
    <div class="rule" style="margin:24px 0;"></div>
    <div style="text-align:center;margin-bottom:26px;">
      <div class="eyebrow" style="margin-bottom:8px;">Your Archetype</div>
      <h1 class="display archetype-name">${escapeHtml(topArchetype.sub)}</h1>
      <p class="archetype-quote">"${escapeHtml(topArchetype.fantasy)}"</p>
    </div>
    <div style="margin-bottom:30px;">
      <div class="eyebrow" style="text-align:center;margin-bottom:12px;">Factions Built For This</div>
      <div class="chip-row">${factionChips}</div>
    </div>
    ${secondaryHtml}
    <div style="text-align:center;">
      <button class="btn-ghost" id="restart-btn">Run Assessment Again</button>
    </div>
  `;
}

function render() {
  const app = document.getElementById("app");
  const total = QUESTIONS.length;

  if (step === -1) {
    app.innerHTML = renderIntro();
    document.getElementById("start-btn").addEventListener("click", () => {
      step = 0;
      render();
    });
  } else if (step >= 0 && step < total) {
    app.innerHTML = renderQuestion(step);
    document.querySelectorAll("#options .opt-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.getAttribute("data-opt"), 10);
        choose(QUESTIONS[step].options[idx].scores);
      });
    });
  } else {
    app.innerHTML = renderResults();
    const restartBtn = document.getElementById("restart-btn");
    if (restartBtn) restartBtn.addEventListener("click", restart);
  }
}

render();
</script>
</body>
</html>
