<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>What's Your 40K Playstyle?</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,500&family=Oswald:wght@500;600&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
        linear-gradient(rgba(12,10,12,.82), rgba(12,10,12,.94)),
        url('mapofgalaxy.png');
    background-size: cover;
    background-attachment: fixed;
    color: #e9e1cd;
    font-family: 'Crimson Pro', serif;
}

body {
    display: flex;
    justify-content: center;
    padding: 40px 16px 70px;
}

#app {
    width: 100%;
    max-width: 720px;
}

.eyebrow {
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-size: 11px;
    color: #9c8f6f;
}

.display {
    font-family: 'Cinzel', serif;
    letter-spacing: 0.02em;
}

.rule {
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        #b9924a66,
        transparent
    );
}

/* =========================================================
   INTRO
========================================================= */

.intro {
    text-align: center;
    padding: 36px 8px;
}

.intro h1 {
    font-size: 36px;
    font-weight: 800;
    color: #e9e1cd;
    margin: 14px 0 18px;
    line-height: 1.15;
}

.intro p {
    color: #a89c86;
    font-size: 17px;
    max-width: 500px;
    margin: 0 auto 20px;
    line-height: 1.65;
}

.intro .small-note {
    color: #756d60;
    font-size: 13px;
    max-width: 450px;
    margin: 0 auto 30px;
    line-height: 1.5;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn-primary {
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 13px;
    background: #7c2029;
    color: #f2e6d8;
    border: 1px solid #a03039;
    padding: 14px 28px;
    cursor: pointer;
    transition: all .15s ease;
    border-radius: 2px;
}

.btn-primary:hover {
    background: #93262f;
    transform: translateY(-1px);
}

.btn-ghost {
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 12px;
    background: transparent;
    color: #b9924a;
    border: 1px solid #b9924a55;
    padding: 12px 22px;
    cursor: pointer;
    border-radius: 2px;
    transition: all .15s ease;
}

.btn-ghost:hover {
    background: #b9924a1a;
}

/* =========================================================
   QUESTIONS
========================================================= */

.q-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
}

.q-header .blood {
    color: #7c2029;
}

.progress-track {
    height: 2px;
    background: #2a2426;
    margin-bottom: 32px;
    position: relative;
}

.progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: #b9924a;
    transition: width .3s ease;
}

.q-category {
    text-align: center;
    margin-bottom: 10px;
}

.q-title {
    font-size: 25px;
    font-weight: 700;
    color: #e9e1cd;
    margin-bottom: 26px;
    line-height: 1.35;
    text-align: center;
}

.opt-btn {
    text-align: left;
    width: 100%;
    padding: 17px 19px;
    margin-bottom: 10px;
    background: #19161a;
    border: 1px solid #322b2c;
    color: #e9e1cd;
    font-family: 'Crimson Pro', serif;
    font-size: 16px;
    line-height: 1.4;
    border-radius: 2px;
    cursor: pointer;
    transition: all .15s ease;
    display: block;
}

.opt-btn:hover {
    border-color: #b9924a;
    background: #221c1d;
    transform: translateX(2px);
}

.opt-btn:focus-visible {
    outline: 2px solid #b9924a;
    outline-offset: 2px;
}

/* =========================================================
   RESULTS
========================================================= */

.results {
    text-align: center;
}

.macro-label {
    text-align: center;
    font-size: 13px;
    letter-spacing: .2em;
    color: #7c2029;
    margin-bottom: 10px;
    text-transform: uppercase;
}

.radar-wrap {
    width: 100%;
    margin-bottom: 8px;
    display: flex;
    justify-content: center;
}

.archetype-name {
    font-size: 31px;
    font-weight: 800;
    color: #e9e1cd;
    margin-bottom: 14px;
    line-height: 1.2;
}

.archetype-quote {
    font-style: italic;
    color: #c9bda0;
    font-size: 18px;
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.6;
}

.section {
    margin-top: 34px;
}

.section-title {
    text-align: center;
    margin-bottom: 16px;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-box {
    background: #19161a;
    border: 1px solid #322b2c;
    padding: 22px;
    text-align: left;
}

.profile-intro {
    color: #c9bda0;
    font-size: 16px;
    line-height: 1.65;
    margin: 0;
}

.trait {
    margin-bottom: 16px;
}

.trait:last-child {
    margin-bottom: 0;
}

.trait-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.trait-name {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: 11px;
    color: #d8c79a;
}

.trait-score {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    color: #9c8f6f;
}

.trait-track {
    height: 5px;
    background: #2a2426;
}

.trait-fill {
    height: 100%;
    background: #7c2029;
}

/* =========================================================
   COMBINATIONS
========================================================= */

.combo-box {
    background:
        linear-gradient(135deg, #21191a, #181519);
    border: 1px solid #594832;
    padding: 22px;
    text-align: left;
    margin-bottom: 12px;
}

.combo-rank {
    font-family: 'Oswald', sans-serif;
    color: #7c2029;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.combo-name {
    font-family: 'Cinzel', serif;
    color: #e9e1cd;
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 7px;
}

.combo-description {
    color: #a89c86;
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 10px;
}

.combo-why {
    color: #c9bda0;
    font-size: 14px;
    line-height: 1.5;
}

/* =========================================================
   MATCHES
========================================================= */

.match-box {
    background: #19161a;
    border: 1px solid #2a2426;
    padding: 19px 21px;
    margin-bottom: 10px;
    text-align: left;
}

.match-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: baseline;
}

.match-name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 18px;
    color: #e9e1cd;
}

.match-score {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    color: #b9924a;
    white-space: nowrap;
}

.match-type {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: #7c2029;
    font-size: 10px;
    margin: 4px 0 8px;
}

.match-reason {
    color: #a89c86;
    font-size: 14.5px;
    line-height: 1.5;
}

/* =========================================================
   WHAT YOUR ANSWERS SAY
========================================================= */

.analysis-box {
    background: #171418;
    border-left: 3px solid #7c2029;
    padding: 20px 22px;
    text-align: left;
}

.analysis-box p {
    color: #c9bda0;
    font-size: 15.5px;
    line-height: 1.65;
    margin: 0 0 12px;
}

.analysis-box p:last-child {
    margin-bottom: 0;
}

.analysis-highlight {
    color: #e9e1cd;
}

/* =========================================================
   SECONDARY / TERTIARY
========================================================= */

.secondary-box {
    background: #19161a;
    border: 1px solid #2a2426;
    padding: 18px 22px;
    margin-bottom: 12px;
    border-radius: 2px;
    text-align: left;
}

.sub-name {
    font-size: 19px;
    font-weight: 700;
    color: #e9e1cd;
    margin-bottom: 5px;
}

.sub-quote {
    color: #a89c86;
    font-size: 14.5px;
    margin-bottom: 10px;
    line-height: 1.5;
}

.chip {
    font-family: 'Oswald', sans-serif;
    font-size: 11.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 6px 12px;
    border: 1px solid #b9924a55;
    color: #d8c79a;
    border-radius: 2px;
    background: #1c1717;
    display: inline-block;
}

.chip-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
}

/* =========================================================
   FOOTER
========================================================= */

.result-footer {
    text-align: center;
    margin-top: 38px;
}

@media (max-width: 600px) {

    body {
        padding: 25px 12px 50px;
    }

    .intro h1 {
        font-size: 30px;
    }

    .q-title {
        font-size: 22px;
    }

    .match-top {
        flex-direction: column;
        gap: 3px;
    }

}

</style>
</head>

                label: "Slip around their advance and threaten somewhere they left exposed.",
                scores: { "Ambush": 3 }
            },
            {
                label: "Use their commitment against them by creating an even more urgent threat elsewhere.",
                scores: { "Pressure": 3 }
            },
            {
                label: "Bring enough forces into the area to absorb the attack and overwhelm it.",
                scores: { "Mass": 3 }
            }
        ]
    },

    {
        category: "Mission",
        text: "You must accomplish an objective in an unfamiliar situation. What would you rather have?",
        options: [
            {
                label: "The freedom to move quickly enough that I can choose the engagement.",
                scores: { "Mobility": 3 }
            },
            {
                label: "A collection of specialized capabilities so I can adapt as new problems appear.",
                scores: { "Toolbox": 3 }
            },
            {
                label: "A force resilient enough that losses along the way do not stop the mission.",
                scores: { "Attrition": 3 }
            },
            {
                label: "A small force with enough individual capability to complete the objective itself.",
                scores: { "Elite": 3 }
            }
        ]
    }

];

/* =========================================================
   STATE
========================================================= */

let step = -1;

let scores = {};

let answerHistory = [];


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(str) {

    const div = document.createElement("div");

    div.textContent = str;

    return div.innerHTML;

}


function choose(optionScores, optionLabel) {

    Object.entries(optionScores).forEach(([key, value]) => {

        scores[key] = (scores[key] || 0) + value;

    });

    answerHistory.push({
        question: QUESTIONS[step].text,
        answer: optionLabel
    });

    step++;

    render();

}


function restart() {

    scores = {};

    answerHistory = [];

    step = -1;

    render();

}


function normalizedScores() {

    const values = MACRO_ORDER.map(
        macro => scores[macro] || 0
    );

    const max = Math.max(...values, 1);

    return MACRO_ORDER.map(macro => ({
        macro,
        raw: scores[macro] || 0,
        percentage: Math.round(
            ((scores[macro] || 0) / max) * 100
        )
    }));

}


/* =========================================================
   RADAR
========================================================= */

function radarSVG() {

    const size = 320;

    const cx = size / 2;

    const cy = size / 2;

    const outerR = 105;

    const data = normalizedScores();

    const maxVal = Math.max(
        ...data.map(x => x.raw),
        1
    );

    const n = data.length;

    const angleFor = i =>
        (Math.PI * 2 * i) / n - Math.PI / 2;


    let rings = "";

    [0.25, 0.5, 0.75, 1].forEach(f => {

        const pts = data.map((_, i) => {

            const a = angleFor(i);

            const r = outerR * f;

            return `
                ${cx + r * Math.cos(a)},
                ${cy + r * Math.sin(a)}
            `;

        }).join(" ");

        rings += `
            <polygon
                points="${pts}"
                fill="none"
                stroke="#3a3234"
                stroke-width="1"
            />
        `;

    });


    let spokes = "";

    data.forEach((_, i) => {

        const a = angleFor(i);

        const x = cx + outerR * Math.cos(a);

        const y = cy + outerR * Math.sin(a);

        spokes += `
            <line
                x1="${cx}"
                y1="${cy}"
                x2="${x}"
                y2="${y}"
                stroke="#3a3234"
                stroke-width="1"
            />
        `;

    });


    const dataPts = data.map((m, i) => {

        const a = angleFor(i);

        const r =
            outerR *
            (m.raw / maxVal);

        return `
            ${cx + r * Math.cos(a)},
            ${cy + r * Math.sin(a)}
        `;

    }).join(" ");


    const dataPolygon = `
        <polygon
            points="${dataPts}"
            fill="#7c2029"
            fill-opacity="0.55"
            stroke="#b9924a"
            stroke-width="2"
        />
    `;


    let labels = "";

    data.forEach((m, i) => {

        const a = angleFor(i);

        const r = outerR + 22;

        const x = cx + r * Math.cos(a);

        const y = cy + r * Math.sin(a);

        let anchor = "middle";

        if (Math.cos(a) > .3)
            anchor = "start";

        else if (Math.cos(a) < -.3)
            anchor = "end";


        labels += `
            <text
                x="${x}"
                y="${y}"
                fill="#b9924a"
                font-size="11"
                font-family="Oswald, sans-serif"
                text-anchor="${anchor}"
                dominant-baseline="middle"
            >
                ${m.macro}
            </text>
        `;

    });


    return `
        <svg
            viewBox="0 0 ${size} ${size}"
            width="100%"
            height="320"
            style="max-width:350px;"
        >
            ${rings}
            ${spokes}
            ${dataPolygon}
            ${labels}
        </svg>
    `;

}


/* =========================================================
   PRIMARY / SECONDARY / TERTIARY ARCHETYPES
========================================================= */

function archetypeResults() {

    const scored = ARCHETYPES.map(a => {

        const macroScore =
            scores[a.macro] || 0;

        const relatedScore =
            a.factions.length;

        return {
            archetype: a,
            score: macroScore * 10 + relatedScore
        };

    });

    scored.sort(
        (a, b) => b.score - a.score
    );

    return scored;

}


/* =========================================================
   COMBINATION SCORING
========================================================= */

function combinationResults() {

    return COMBINATIONS.map(combo => {

        let total = 0;

        combo.traits.forEach(trait => {

            total += scores[trait] || 0;

        });

        return {
            ...combo,
            score: total
        };

    }).sort(
        (a, b) => b.score - a.score
    );

}


/* =========================================================
   FACTION MATCHING
========================================================= */

function factionResults() {

    const maxTrait =
        Math.max(
            ...MACRO_ORDER.map(
                x => scores[x] || 0
            ),
            1
        );


    return Object.entries(FACTION_PROFILES)
        .map(([name, profile]) => {

            let score = 0;

            MACRO_ORDER.forEach(trait => {

                const userScore =
                    (scores[trait] || 0) /
                    maxTrait;

                const factionScore =
                    profile.traits[trait] / 10;

                /*
                 * Similarity matters more than absolute
                 * preference strength.
                 */
                score +=
                    100 -
                    Math.abs(
                        userScore * 100 -
                        factionScore * 100
                    );

            });


            return {
                name,
                profile,
                score:
                    score / MACRO_ORDER.length
            };

        })
        .sort(
            (a, b) => b.score - a.score
        );

}


/* =========================================================
   PROFILE TEXT
========================================================= */

function getProfileDescription() {

    const sorted =
        normalizedScores()
            .sort(
                (a, b) =>
                    b.raw - a.raw
            );


    const first = sorted[0];

    const second = sorted[1];

    const third = sorted[2];


    const descriptions = {

        Firepower:
            "You place a high value on controlling the battlefield through damage output and threat ranges. You generally want your opponent to have fewer safe places to stand.",

        Mass:
            "You are comfortable solving problems with numbers. Losing individual units is acceptable when the army as a whole continues to create pressure.",

        Pressure:
            "You want to dictate the pace of the game. Your ideal army makes the opponent react to you rather than allowing them to execute their own plan freely.",

        Elite:
            "You place a high value on individual unit quality. You would rather have a few exceptional pieces than a large number of disposable ones.",

        Mobility:
            "Positioning is a major part of how you want to win. You value speed, board access, threat ranges and the ability to choose where engagements happen.",

        Attrition:
            "You like games where your army becomes increasingly difficult to remove. You are comfortable winning slowly if every turn makes the opponent's position worse.",

        Synergy:
            "You enjoy constructing interactions between units, abilities and resources. The satisfaction comes from making the army operate better as a system than its individual parts suggest.",

        Ambush:
            "You value uncertainty and asymmetric positioning. You want the opponent to have to account for threats they cannot immediately see or safely predict.",

        Toolbox:
            "You strongly value having answers. You would rather have flexibility and specialized tools than depend entirely on one game plan."

    };


    return `
        Your strongest preference is
        <span class="analysis-highlight">${first.macro}</span>,
        followed by
        <span class="analysis-highlight">${second.macro}</span>
        and
        <span class="analysis-highlight">${third.macro}</span>.
        ${descriptions[first.macro]}
        ${descriptions[second.macro]}
    `;

}


/* =========================================================
   MATCH REASON
========================================================= */

function factionReason(result) {

    const strongestUserTraits =
        normalizedScores()
            .sort(
                (a, b) =>
                    b.raw - a.raw
            )
            .slice(0, 3);


    const names =
        strongestUserTraits
            .map(x => x.macro)
            .join(", ");


    return `
        This faction overlaps strongly with your
        ${names.toLowerCase()} preferences.
        The important point is that this is a preference
        match rather than a single-archetype match —
        you can reach this faction through several different
        playstyles.
    `;

}


/* =========================================================
   INTRO
========================================================= */

function renderIntro() {

    return `

        <div class="intro">

            <div
                class="eyebrow"
                style="margin-bottom:14px;"
            >
                Doctrine Assessment · 25 Questions
            </div>

            <h1 class="display">
                WHAT'S YOUR<br>
                40K PLAYSTYLE?
            </h1>

            <p>
                This isn't a faction quiz.
                It's a profile of how you actually want

            </p>

            </p>

            >

            </button>

        </div>

    `;

}


/* =========================================================
   QUESTION
========================================================= */

function renderQuestion(index) {

    const q = QUESTIONS[index];

    const total = QUESTIONS.length;

    const pct =
        (index / total) * 100;


    const optionsHtml =
        q.options
            .map(
                (opt, i) => `
                    <button
                        class="opt-btn"
                        data-opt="${i}"
                    >
                        ${escapeHtml(opt.label)}
                    </button>
                `
            )
            .join("");


    return `

        <div class="q-header">

            <span class="eyebrow">
                Turn
                ${String(index + 1).padStart(2, "0")}
                /
                ${String(total).padStart(2, "0")}
            </span>

            <span class="eyebrow blood">
                Auspex Reading
            </span>

        </div>

        <div class="progress-track">

            <div
                class="progress-fill"
                style="width:${pct}%"
            ></div>

        </div>

        <div class="eyebrow q-category">
            ${escapeHtml(q.category)}
        </div>

        <h2 class="display q-title">
            ${escapeHtml(q.text)}
        </h2>

        <div id="options">
            ${optionsHtml}
        </div>

    `;

}


/* =========================================================
   PROFILE TRAITS
========================================================= */

function renderProfileTraits() {

    const data =
        normalizedScores()
            .sort(
                (a, b) =>
                    b.raw - a.raw
            );


    return data.map(trait => `

        <div class="trait">

            <div class="trait-header">

                <span class="trait-name">
                    ${trait.macro}
                </span>

                <span class="trait-score">
                    ${trait.percentage}%
                </span>

            </div>

            <div class="trait-track">

                <div
                    class="trait-fill"
                    style="width:${trait.percentage}%"
                ></div>

            </div>

        </div>

    `).join("");

}


/* =========================================================
   RESULTS
========================================================= */

function renderResults() {

    const archetypes =
        archetypeResults();


    const primary =
        archetypes[0].archetype;


    const secondary =
        archetypes[1].archetype;


    const tertiary =
        archetypes[2].archetype;


    const combos =
        combinationResults()
            .slice(0, 3);


    const factions =
        factionResults()
            .slice(0, 10);


    const factionHtml =
        factions
            .map((faction, index) => {

                let type = "Strong Match";

                if (index >= 4)
                    type = "Compatible Match";

                if (index >= 7)
                    type = "Possible Match";


                return `

                    <div class="match-box">

                        <div class="match-top">

                            <div class="match-name">
                                ${escapeHtml(faction.name)}
                            </div>

                            <div class="match-score">
                                ${Math.round(faction.score)}% MATCH
                            </div>

                        </div>

                        <div class="match-type">
                            ${type}
                        </div>

                        <div class="match-reason">
                            ${factionReason(faction)}
                        </div>

                    </div>

                `;

            })
            .join("");


    const comboHtml =
        combos
            .map((combo, index) => `

                <div class="combo-box">

                    <div class="combo-rank">
                        Combination ${index + 1}
                    </div>

                    <div class="combo-name">
                        ${escapeHtml(combo.name)}
                    </div>

                    <div class="combo-description">
                        ${escapeHtml(combo.description)}
                    </div>

                    <div class="combo-why">

                        <strong>
                            Why it fits:
                        </strong>

                        ${combo.traits.join(" · ")}

                        <br><br>

                        <strong>
                            Likely faction homes:
                        </strong>

                        ${combo.factions.join(", ")}

                    </div>

                </div>

            `)
            .join("");


    const secondaryFactions =
        secondary.factions
            .map(
                f => `
                    <span class="chip">
                        ${escapeHtml(f)}
                    </span>
                `
            )
            .join("");


    return `

        <div class="results">

            <div
                class="eyebrow"
                style="margin-bottom:6px;"
            >
                Auspex Scan Complete
            </div>

            <h2 class="display macro-label">
                ${escapeHtml(primary.macro)}
            </h2>

            <div class="radar-wrap">

                ${radarSVG()}

            </div>

            <div
                class="rule"
                style="margin:24px 0;"
            ></div>


            <!-- PRIMARY ARCHETYPE -->

            <div style="margin-bottom:30px;">

                <div
                    class="eyebrow"
                    style="margin-bottom:8px;"
                >
                    Primary Playstyle
                </div>

                <h1 class="display archetype-name">
                    ${escapeHtml(primary.sub)}
                </h1>

                <p class="archetype-quote">
                    "${escapeHtml(primary.fantasy)}"
                </p>

            </div>


            <!-- PREFERENCE PROFILE -->

            <div class="section">

                <div class="eyebrow section-title">
                    Your Preference Profile
                </div>

                <div class="profile-box">

                    <p class="profile-intro">
                        ${getProfileDescription()}
                    </p>

                    <div
                        class="rule"
                        style="margin:20px 0;"
                    ></div>

                    ${renderProfileTraits()}

                </div>

            </div>


            <!-- WHAT YOUR ANSWERS SAY -->

            <div class="section">

                <div class="eyebrow section-title">
                    What Your Answers Actually Say
                </div>

                <div class="analysis-box">

                    <p>
                        Your answers don't point to one
                        faction-specific identity.
                        They show a broader preference for
                        <span class="analysis-highlight">
                            how the game should feel
                        </span>
                        when you're playing it.
                    </p>

                    <p>
                        Your strongest pattern is
                        <span class="analysis-highlight">
                            ${escapeHtml(primary.macro)}
                        </span>,
                        but your secondary tendencies toward
                        <span class="analysis-highlight">
                            ${escapeHtml(secondary.macro)}
                        </span>
                        and
                        <span class="analysis-highlight">
                            ${escapeHtml(tertiary.macro)}
                        </span>
                        significantly change what that means.
                    </p>

                    <p>
                        That combination is why your results
                        are not limited to one army archetype.
                        Several factions can satisfy the same
                        underlying preferences in very different
                        ways.
                    </p>

                </div>

            </div>


            <!-- COMBINATIONS -->

            <div class="section">

                <div class="eyebrow section-title">
                    Your Playstyle Combinations
                </div>

                ${comboHtml}

            </div>


            <!-- SECONDARY -->

            <div class="section">

                <div class="eyebrow section-title">
                    Secondary & Tertiary Leanings
                </div>

                <div class="secondary-box">

                    <div
                        class="eyebrow"
                        style="margin-bottom:8px;"
                    >
                        Secondary
                    </div>

                    <div class="display sub-name">
                        ${escapeHtml(secondary.sub)}
                    </div>

                    <p class="sub-quote">
                        "${escapeHtml(secondary.fantasy)}"
                    </p>

                    <div class="chip-row">
                        ${secondaryFactions}
                    </div>

                </div>


                <div class="secondary-box">

                    <div
                        class="eyebrow"
                        style="margin-bottom:8px;"
                    >
                        Tertiary
                    </div>

                    <div class="display sub-name">
                        ${escapeHtml(tertiary.sub)}
                    </div>

                    <p class="sub-quote">
                        "${escapeHtml(tertiary.fantasy)}"
                    </p>

                </div>

            </div>


            <!-- FACTIONS -->

            <div class="section">

                <div class="eyebrow section-title">
                    Strongest Faction Matches
                </div>

                <p
                    style="
                        color:#a89c86;
                        font-size:15px;
                        line-height:1.6;
                        max-width:560px;
                        margin:0 auto 20px;
                    "
                >
                    These aren't simply factions associated with
                    your highest-scoring archetype. They're factions
                    whose broader playstyle profile overlaps with
                    the preferences revealed by your answers.
                </p>

                ${factionHtml}

            </div>


            <!-- FINAL -->

            <div class="result-footer">

                <div
                    class="rule"
                    style="margin-bottom:28px;"
                ></div>

                <button
                    class="btn-ghost"
                    id="restart-btn"
                >
                    Run Assessment Again
                </button>

            </div>

        </div>

    `;

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    const app =
        document.getElementById("app");

    const total =
        QUESTIONS.length;


    if (step === -1) {

        app.innerHTML =
            renderIntro();


        document
            .getElementById("start-btn")
            .addEventListener(
                "click",
                () => {

                    step = 0;

                    render();

                }
            );

    }


    else if (
        step >= 0 &&
        step < total
    ) {

        app.innerHTML =
            renderQuestion(step);


        document
            .querySelectorAll(
                "#options .opt-btn"
            )
            .forEach(btn => {

                btn.addEventListener(
                    "click",
                    () => {

                        const idx =
                            parseInt(
                                btn.getAttribute(
                                    "data-opt"
                                ),
                                10
                            );


                        const option =
                            QUESTIONS[step]
                                .options[idx];


                        choose(
                            option.scores,
                            option.label
                        );

                    }
                );

            });

    }


    else {

        app.innerHTML =
            renderResults();


        const restartBtn =
            document.getElementById(
                "restart-btn"
            );


        if (restartBtn) {

            restartBtn.addEventListener(
                "click",
                restart
            );

        }

    }

}


render();

</script>
