* {
    box-sizing: border-box;
}

html,
body {

body {

button {

#app {

/* -------------------------------------------------------
   TYPOGRAPHY
------------------------------------------------------- */

.display {
    font-family: "Cinzel", serif;

}

.eyebrow {
    font-family: "Oswald", sans-serif;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-size: 11px;
    color: #9c8f6f;
}

.rule {
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #b9924a66,
            transparent
        );
}

/* -------------------------------------------------------
   INTRO
------------------------------------------------------- */

.intro {
    text-align: center;
    padding: 50px 10px;
}

.intro h1 {
    font-size: 38px;
    font-weight: 800;
    color: #e9e1cd;

    margin: 16px 0 20px;

    line-height: 1.15;
}

.intro p {
    color: #a89c86;

    font-size: 18px;

    max-width: 520px;

    margin:
        0 auto 32px;

    line-height: 1.6;
}

/* -------------------------------------------------------
   BUTTONS
------------------------------------------------------- */

.btn-primary {
    font-family: "Oswald", sans-serif;

    letter-spacing: 0.14em;
    text-transform: uppercase;

    font-size: 13px;

    background: #7c2029;
    color: #f2e6d8;

    border: 1px solid #a03039;

    padding: 15px 30px;

    cursor: pointer;

    transition: 0.15s ease;

    border-radius: 2px;
}

.btn-primary:hover {
    background: #93262f;
    transform: translateY(-1px);
}

.btn-ghost {
    font-family: "Oswald", sans-serif;

    letter-spacing: 0.14em;
    text-transform: uppercase;

    font-size: 12px;

    background: transparent;

    color: #b9924a;

    border: 1px solid #b9924a55;

    padding: 12px 22px;

    cursor: pointer;

    border-radius: 2px;

    transition: 0.15s ease;
}

.btn-ghost:hover {
    background: #b9924a1a;
}

/* -------------------------------------------------------
   QUESTIONS
------------------------------------------------------- */

.question-header {
    display: flex;

    justify-content: space-between;
    align-items: baseline;

    margin-bottom: 8px;
}

.question-number {
    color: #9c8f6f;
}

.progress-track {
    height: 2px;

    background: #2a2426;

    margin-bottom: 32px;
}

.progress-fill {
    height: 100%;

    background: #b9924a;

    transition:
        width 0.3s ease;
}

.question-title {
    font-size: 26px;

    font-weight: 700;

    line-height: 1.35;

    margin-bottom: 28px;
}

.question-subtitle {
    color: #9c8f6f;

    font-size: 15px;

    margin-top: -18px;

    margin-bottom: 25px;
}

.option {
    width: 100%;

    text-align: left;

    padding: 18px 20px;

    margin-bottom: 11px;

    background: #19161a;

    border: 1px solid #322b2c;

    color: #e9e1cd;

    font-size: 16px;

    line-height: 1.45;

    border-radius: 2px;

    cursor: pointer;

    transition:
        border-color 0.15s ease,
        background 0.15s ease,
        transform 0.15s ease;
}

.option:hover {
    border-color: #b9924a;

    background: #221c1d;

    transform: translateX(3px);
}

/* -------------------------------------------------------
   RESULTS
------------------------------------------------------- */

.results {

.result-header {

}

.result-title {

.result-description {

    line-height: 1.6;

    margin: auto;

/* -------------------------------------------------------

------------------------------------------------------- */

.preference-section {

}

.preference-row {
    margin-bottom: 17px;
}

.preference-header {
    display: flex;

    justify-content: space-between;

    margin-bottom: 6px;
}

.preference-name {
    font-family: "Oswald", sans-serif;

    font-size: 12px;

    letter-spacing: 0.08em;

    text-transform: uppercase;

    color: #d8c79a;
}

.preference-percent {
    font-family: "Oswald", sans-serif;

    font-size: 11px;

    color: #9c8f6f;
}

.preference-track {
    height: 5px;

    background: #2a2426;

    border-radius: 1px;

    overflow: hidden;
}

.preference-fill {
    height: 100%;

    background: #7c2029;

    margin-bottom: 14px;

    border-radius: 2px;

.recommendation.primary {
    border-color: #b9924a88;
}

.recommendation-rank {
    font-family: "Oswald", sans-serif;

    letter-spacing: 0.2em;

    text-transform: uppercase;

    color: #b9924a;

    margin-bottom: 8px;

    padding: 5px 9px;

    border: 1px solid #b9924a44;

    color: #d8c79a;

    font-family: "Oswald", sans-serif;

    font-size: 10px;

    text-transform: uppercase;

------------------------------------------------------- */

/* -------------------------------------------------------

------------------------------------------------------- */

        padding: 19px;

    The quiz discovers the combination.
*/

                }
            }

        ]
    },


    {

            "Your ideal victory looks like:",

        options: [

            {

                    "I controlled where the fight happened.",

                }
            },

                }

            },

    },

];


/* =========================================================
   STATE
========================================================= */

let questionIndex = -1;

let preferences = {};

let granularScores = {};


/* =========================================================
   QUIZ LOGIC
========================================================= */

function resetScores() {

    preferences = {};
    granularScores = {};

}


function addScores(scores) {

    Object.entries(scores).forEach(
        ([key, value]) => {

            preferences[key] =
                (preferences[key] || 0) + value;

        }
    );

}


function chooseOption(option) {

    addScores(option.scores);

    questionIndex++;

    render();

}


/* =========================================================
   NORMALIZE PREFERENCES
========================================================= */

function getPreferencePercentages() {

    const values =
        Object.entries(preferences);

    const max =
        Math.max(
            ...values.map(
                ([, value]) => value
            ),
            1
        );

    return Object.entries(preferences)
        .map(
            ([name, value]) => ({
                name,
                value,
                percentage:
                    Math.round(
                        (value / max) * 100
                    )
            })
        )
        .sort(
            (a, b) =>
                b.value - a.value
        );

}


/* =========================================================
   FACTION MATCHING
========================================================= */

/*
    This is the important part.

    We compare the player's preference profile against
    every faction.

    There is no "winner because it has the highest raw
    number".

    Instead we calculate similarity across ALL preferences.

    That means:

        Mobility + Attrition

    can produce a very different winner than:

        Mobility alone.
*/

function calculateFactionMatches() {

    const prefs =
        getPreferencePercentages();

    const maxPreference =
        Math.max(
            ...prefs.map(
                p => p.value
            ),
            1
        );

    return Object.entries(FACTIONS)
        .map(
            ([name, faction]) => {

                let total = 0;

                let possible = 0;

                const matchingTraits = [];

                prefs.forEach(pref => {

                    const importance =
                        pref.value /
                        maxPreference;

                    const factionValue =
                        faction.scores[
                            pref.name
                        ] || 0;

                    total +=
                        factionValue *
                        importance;

                    possible +=
                        10 *
                        importance;

                    if (
                        factionValue >= 7 &&
                        pref.value >=
                            maxPreference * 0.65
                    ) {

                        matchingTraits.push(
                            pref.name
                        );

                    }

                });

                const percentage =
                    Math.round(
                        (total / possible) * 100
                    );

                return {

                    name,

                    percentage,

                    matchingTraits,

                    description:
                        faction.description,

                    styles:
                        faction.styles

                };

            }
        )
        .sort(
            (a, b) =>
                b.percentage -
                a.percentage
        );

}


/* =========================================================
   RADAR
========================================================= */

function radarSVG() {

    const prefs =
        Object.fromEntries(
            getPreferencePercentages()
                .map(
                    p => [
                        p.name,
                        p.percentage
                    ]
                )
        );

    const categories =
        Object.keys(MACROS);

    const size = 320;

    const center = 160;

    const radius = 105;

    const angle =
        i =>
            (
                Math.PI * 2 * i /
                categories.length
            ) -
            Math.PI / 2;


    const points =
        categories
            .map(
                (category, i) => {

                    const a =
                        angle(i);

                    const value =
                        prefs[category] || 0;

                    const r =
                        radius *
                        (value / 100);

                    return `
                        ${center + r * Math.cos(a)},
                        ${center + r * Math.sin(a)}
                    `;

                }
            )
            .join(" ");


    const grid =
        [25, 50, 75, 100]
            .map(level => {

                const pts =
                    categories
                        .map(
                            (_, i) => {

                                const a =
                                    angle(i);

                                const r =
                                    radius *
                                    (level / 100);

                                return `
                                    ${center + r * Math.cos(a)},
                                    ${center + r * Math.sin(a)}
                                `;

                            }
                        )
                        .join(" ");

                return `
                    <polygon
                        points="${pts}"
                        fill="none"
                        stroke="#3a3234"
                    />
                `;

            })
            .join("");


    const labels =
        categories
            .map(
                (category, i) => {

                    const a =
                        angle(i);

                    const r =
                        radius + 23;

                    const x =
                        center +
                        r *
                        Math.cos(a);

                    const y =
                        center +
                        r *
                        Math.sin(a);

                    return `
                        <text
                            x="${x}"
                            y="${y}"
                            fill="#b9924a"
                            font-size="10"
                            text-anchor="middle"
                            dominant-baseline="middle"
                        >
                            ${category}
                        </text>
                    `;

                }
            )
            .join("");


    return `
        <svg
            viewBox="0 0 ${size} ${size}"
            width="320"
            height="320"
        >

            ${grid}

            <polygon
                points="${points}"
                fill="#7c2029"
                fill-opacity="0.55"
                stroke="#b9924a"
                stroke-width="2"
            />

            ${labels}

        </svg>
    `;

}

            </div>

                <div

                    "

                            <div class="preference-row">

                                    ></div>

                                </div>

                        `
                    )
                    .join("")}

            </div>


            <div class="rule"></div>


            <div class="why-box">

                <h3>
                    What this actually means
                </h3>

                <p>

                    Your strongest preferences are
                    <strong>
                        ${topPreferences
                            .map(
                                p => p.name
                            )
                            .join(" + ")}
                    </strong>.

                    Rather than asking which faction is
                    "best", we're looking for armies whose
                    normal gameplay creates a similar
                    experience.

                </p>

            </div>


            <div
                class="eyebrow"
                style="
                    text-align:center;
                    margin:30px 0 15px;
                "
            >

            </div>


            ${renderFaction(

            )}

            <div

            >

                <h3>
                    Why ${top.name}?

            <div

                    margin-top:30px;

            >

                <button
                    class="btn-ghost"
                    id="restart"
                >
                    Run Assessment Again
                </button>

            </div>

        </div>

    `;

}


/* =========================================================
   FACTION CARD
========================================================= */

function renderFaction(
    faction,
    label
) {

    return `

        <div
            class="
                recommendation
                ${
                    label ===
                    "Primary Recommendation"
                        ? "primary"
                        : ""
                }
            "
        >

            <div class="recommendation-rank">
                ${label}
            </div>

            <div class="recommendation-name">

                ${faction.name}

            </div>

            <div class="recommendation-score">

                PLAYSTYLE MATCH:
                ${faction.percentage}%

            </div>

            <div class="recommendation-description">

                ${faction.description}

            </div>


            <div class="match-list">

                ${faction.matchingTraits
                    .map(
                        trait => `

                            <span class="match-tag">
                                ${trait}
                            </span>

                        `
                    )
                    .join("")}

            </div>

        </div>

    `;

}


/* =========================================================
   EXPLANATION ENGINE
========================================================= */

function generateWhy(
    faction,
    preferences
) {

    const strongest =
        preferences
            .slice(0, 2)
            .map(
                p => p.name
            );


    const reasons = [];


    strongest.forEach(
        preference => {

            const value =
                FACTIONS[
                    faction.name
                ].scores[
                    preference
                ] || 0;


            if (value >= 8) {

                reasons.push(
                    `you strongly value ${preference.toLowerCase()}`
                );

            }

        }
    );


    if (!reasons.length) {

        return `
            ${faction.name} provides a broad overlap
            with your answers without relying entirely
            on one particular preference.
        `;

    }


    return `
        ${faction.name} stands out because
        ${reasons.join(" and ")}.
        The important part is that it doesn't merely
        match one answer — its overall battlefield
        identity overlaps with several of your strongest
        preferences.
    `;

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    const app =
        document.getElementById("app");


    if (questionIndex === -1) {

        app.innerHTML =
            renderIntro();


        document
            .getElementById("start")
            .addEventListener(
                "click",
                () => {

                    resetScores();

                    questionIndex = 0;

                    render();

                }
            );

        return;

    }


    if (
        questionIndex >= 0 &&
        questionIndex <
        QUESTIONS.length
    ) {

        app.innerHTML =
            renderQuestion();


        document
            .querySelectorAll(".option")
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            const index =
                                Number(
                                    button.dataset.index
                                );

                            chooseOption(
                                QUESTIONS[
                                    questionIndex
                                ].options[index]
                            );

                        }
                    );

                }
            );

        return;

    }


    app.innerHTML =
        renderResults();


    document
        .getElementById("restart")
        .addEventListener(
            "click",
            () => {

                questionIndex = -1;

                resetScores();

                render();

            }
        );

}


render();

</script>
