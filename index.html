/* =========================================================
   STATE
========================================================= */

let step = -1;

let macroScores = {};

let archetypeScores = {};


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(str) {

  const div = document.createElement("div");

  div.textContent = str;

  return div.innerHTML;

}


function addScores(option) {

  Object.entries(option.macro || {}).forEach(([key, value]) => {

    macroScores[key] =
      (macroScores[key] || 0) + value;

  });


  Object.entries(option.archetypes || {}).forEach(([key, value]) => {

    archetypeScores[key] =
      (archetypeScores[key] || 0) + value;

  });

}


/* =========================================================
   NORMALIZE MACRO SCORES
========================================================= */

function normalizedMacros() {

  const values =
    Object.values(macroScores);

  const max =
    Math.max(...values, 1);

  return MACROS.map(macro => {

    const raw =
      macroScores[macro] || 0;

    return {

      macro,

      raw,

      percentage:
        Math.round(
          Math.max(0, raw / max) * 100
        )

    };

  });

}


/* =========================================================
   ARCHETYPE RESULT
========================================================= */

function getTopArchetypes() {

  return Object.entries(archetypeScores)

    .sort((a, b) => b[1] - a[1])

    .map(([key, score]) => {

      const [macro, sub] =
        key.split("|");

      return {

        key,

        macro,

        sub,

        score,

        data:
          ARCHETYPES.find(
            a =>
              a.macro === macro &&
              a.sub === sub
          )

      };

    });

}


/* =========================================================
   FACTION MATCHING

   Uses the player's macro profile.

   Distance is based on how similar the faction's
   playstyle coordinates are to the player's preferences.
========================================================= */

function factionMatches() {

  const profile = {};

  const positiveScores =
    MACROS.map(
      m => macroScores[m] || 0
    );

  const max =
    Math.max(...positiveScores, 1);

  MACROS.forEach(macro => {

    profile[macro] =
      Math.max(
        0,
        (macroScores[macro] || 0) / max * 10
      );

  });


  const results =
    FACTIONS.map(faction => {

      let distance = 0;

      MACROS.forEach(macro => {

        const player =
          profile[macro];

        const factionValue =
          faction.profile[macro];

        distance +=
          Math.pow(
            player - factionValue,
            2
          );

      });


      const maxDistance =
        Math.sqrt(
          MACROS.length * 100
        );

      const normalizedDistance =
        Math.sqrt(distance) /
        maxDistance;

      let match =
        (1 - normalizedDistance) * 100;

      match =
        Math.max(
          0,
          Math.min(
            100,
            Math.round(match)
          )
        );


      return {

        ...faction,

        match

      };

    });


  return results.sort(
    (a, b) =>
      b.match - a.match
  );

}


/* =========================================================
   RADAR
========================================================= */

function radarSVG() {

  const data =
    normalizedMacros();

  const size = 330;

  const cx = 165;

  const cy = 165;

  const outerR = 105;

  const n = data.length;


  const angleFor =
    i =>
      (Math.PI * 2 * i) / n
      - Math.PI / 2;


  let rings = "";

  [0.25, 0.5, 0.75, 1]
    .forEach(f => {

      const pts =
        data.map((_, i) => {

          const a =
            angleFor(i);

          const r =
            outerR * f;

          return `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;

        }).join(" ");


      rings += `
        <polygon
          points="${pts}"
          fill="none"
          stroke="#3a3234"
          stroke-width="1"
        />
      `;

    });


  let spokes = "";

  data.forEach((_, i) => {

    const a =
      angleFor(i);

    const x =
      cx + outerR * Math.cos(a);

    const y =
      cy + outerR * Math.sin(a);


    spokes += `
      <line
        x1="${cx}"
        y1="${cy}"
        x2="${x}"
        y2="${y}"
        stroke="#3a3234"
        stroke-width="1"
      />
    `;

  });


  const dataPts =
    data.map((item, i) => {

      const a =
        angleFor(i);

      const r =
        outerR *
        (item.percentage / 100);

      return `
        ${cx + r * Math.cos(a)},
        ${cy + r * Math.sin(a)}
      `;

    }).join(" ");


  const polygon = `
    <polygon
      points="${dataPts}"
      fill="#7c2029"
      fill-opacity="0.55"
      stroke="#b9924a"
      stroke-width="2"
    />
  `;


  let labels = "";

  data.forEach((item, i) => {

    const a =
      angleFor(i);

    const r =
      outerR + 24;

    const x =
      cx + r * Math.cos(a);

    const y =
      cy + r * Math.sin(a);


    let anchor = "middle";

    if (Math.cos(a) > 0.3)
      anchor = "start";

    if (Math.cos(a) < -0.3)
      anchor = "end";


    labels += `
      <text
        x="${x}"
        y="${y}"
        fill="#b9924a"
        font-size="10"
        font-family="Oswald, sans-serif"
        text-anchor="${anchor}"
        dominant-baseline="middle"
      >
        ${item.macro}
      </text>
    `;

  });


  return `
    <svg
      viewBox="0 0 ${size} ${size}"
      width="100%"
      height="330"
      style="max-width:360px;"
    >
      ${rings}
      ${spokes}
      ${polygon}
      ${labels}
    </svg>
  `;

}


/* =========================================================
   RESULT EXPLANATION
========================================================= */

function explainMatch(faction, playerProfile) {

  const strongest =
    [...MACROS]
      .sort(
        (a, b) =>
          playerProfile[b] -
          playerProfile[a]
      )
      .slice(0, 3);


  const names =
    strongest
      .filter(
        macro =>
          faction.profile[macro] >= 7
      )
      .slice(0, 2);


  if (!names.length) {

    return faction.description;

  }


  return `
    ${faction.description}
    Your strongest preferences include
    <strong>${names.join(" and ")}</strong>,
    which are also significant parts of this
    faction's playstyle.
  `;

}

========================================================= */

function renderProfile() {

    normalizedMacros();


  const rows =

          a.percentage
      )
